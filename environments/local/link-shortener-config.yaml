apiVersion: v1
kind: ConfigMap
metadata:
  name: link-shortener-config
  namespace: link-shortener
data:
  JwtSettings__Issuer: LinkShortenerAPI
  JwtSettings__Audience: LinkShortenerClient
  JwtSettings__ExpiryInMinutes: "60"
  AWS__Region: eu-central-1
  AWS__ServiceURL: http://external-dynamodb-svc.link-shortener.svc.cluster.local:8000 # Yerel DynamoDB için
