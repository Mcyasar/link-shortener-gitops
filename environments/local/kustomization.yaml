apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - link-shortener-namespace.yaml
  - link-shortener-secrets.yaml
  - link-shortener-config.yaml
  - link-shortener-deployment.yaml
  - link-shortener-service.yaml
  - link-shortener-ingress.yaml

images:
  - name: link-shortener-backend
    newName: mcysrdckr/link_shortener # Docker Hub repository'nizin tam adı
    newTag: latest # Yerel ortamda genellikle 'latest' veya belirli bir versiyon kullanılır
