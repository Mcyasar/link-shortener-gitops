apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: link-shortener-ingress
  namespace: link-shortener
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: / # Eğer uygulamanız root path'te çalışıyorsa
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:3000"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  ingressClassName: nginx # Docker Desktop'ta genellikle 'nginx' veya 'traefik'
  rules:
  - host: linkshortener.local # Kendi istediğiniz bir hostname belirleyin
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: link-shortener-api-service
            port:
              number: 80 # .NET uygulamanızın expose ettiği port
