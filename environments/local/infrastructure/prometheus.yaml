apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: link-shortener
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--web.console.libraries=/usr/share/prometheus/console_libraries"
          - "--web.console.templates=/usr/share/prometheus/consoles"
          - "--enable-feature=otlp-receiver"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: link-shortener
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    
    # Prometheus'un OTLP üzerinden gelen metrikleri kabul etmesini sağlıyoruz
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          listen_address: "0.0.0.0:4318"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: link-shortener
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP