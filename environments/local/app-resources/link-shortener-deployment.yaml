apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-shortener-api
  namespace: link-shortener
  labels:
    app: link-shortener-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: link-shortener-api
  template:
    metadata:
      labels:
        app: link-shortener-api
    spec:
      containers:
      - name: link-shortener-api
        image: link-shortener-backend:latest # Kendi Docker imajınızla güncelleyin
        ports:
        - containerPort: 80 # 👈 .NET uygulamanızın asıl portu
          name: http
        
        # --- ORTAK CONFIGMAP & SECRET (Tüm değişkenleri topluca çeker) ---
        envFrom:
        - configMapRef:
            name: link-shortener-config
        - secretRef:
            name: link-shortener-secrets

        env:
        - name: MassTransitWorkerEnabled
          value: "false" # Consumer KAPALI

        resources:
          requests:
            cpu: "500m"      # Minimum 0.5 CPU çekirdeği garanti edilsin
            memory: "256Mi"  # Minimum 256 MB RAM
          limits:
            cpu: "2"         # GC veya anlık sıçramalarda (burst) 2 çekirdeğe kadar izin verilsin
            memory: "1Gi"    # Max 1 GB RAM (Out of Memory Kill engellemek için)

        # Liveness ve Readiness Probları (Uygulamanızda /health endpoint'i olduğunu varsayar)
        livenessProbe:
          tcpSocket:                        # 👈 Aynı şekilde liveness probe için de TCP kontrolü
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          tcpSocket:                        # 👈 HTTP yerine tcpSocket kullanıyoruz
            port: 80                      # 👈 LaunchSettings'teki port değeri
          initialDelaySeconds: 10            # .NET ayağa kalkarken Kestrel'e tanınan süre
          periodSeconds: 10
