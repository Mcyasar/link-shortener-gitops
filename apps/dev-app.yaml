apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: link-shortener-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mcyasar/link-shortener-gitops.git'
    targetRevision: HEAD
    path: environments/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true