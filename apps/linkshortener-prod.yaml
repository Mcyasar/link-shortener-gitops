apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkshortener-prod          # 👈 Argo CD arayüzünde görünecek benzersiz isim
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mcyasar/link-shortener-gitops.git'
    targetRevision: HEAD
    path: chart
    helm:
      valueFiles:
        - ../environments/values-prod.yaml # 👈 Production değerlerini okur
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prod-environment     # 👈 Production Pod'larının kurulacağı namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true